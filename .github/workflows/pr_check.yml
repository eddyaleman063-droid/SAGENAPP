name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify no analysis errors
        run: flutter analyze --no-fatal-infos
      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none lib/ test/
      - name: Run tests (fast subset)
        run: flutter test test/services/ test/utils/ test/extensions/ test/providers/ --timeout 60s
      - name: Check for TODO/FIXME in changed files
        run: |
          git diff --name-only origin/master...HEAD | grep '\.dart$' | xargs grep -l 'TODO\|FIXME\|HACK' 2>/dev/null | head -20 || true

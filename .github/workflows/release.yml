name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 5.2.0)'
        required: true
        type: string
      stage:
        description: 'Release stage'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: beta

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: |
            build/app/outputs/flutter-apk/
            build/app/outputs/bundle/release/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SAGEN v${{ inputs.version }} (${{ inputs.stage }})
          body: |
            ## SAGEN v${{ inputs.version }} (${{ inputs.stage }})

            ### Changes
            ${{ needs.generate-changelog.outputs.changelog }}

            ### Downloads
            - **APK**: Download the `.apk` file for direct installation
            - **AAB**: Download the `.aab` file for Play Store upload

            ### Installation
            1. Download the appropriate file
            2. For APK: Enable "Install from unknown sources" and install
            3. For AAB: Upload to Google Play Console
          draft: false
          prerelease: ${{ inputs.stage != 'stable' }}
          files: |
            *.apk
            *.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: inputs.stage == 'beta'
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: release/*.aab
          releaseNotes: |
            SAGEN v${{ inputs.version }} (${{ inputs.stage }})
            ${{ needs.generate-changelog.outputs.changelog }}
